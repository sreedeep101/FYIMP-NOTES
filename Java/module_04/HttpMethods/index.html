<!DOCTYPE html>
<html>
<head>
    <title>HTTP Methods Demo</title>
</head>
<body>

    <h2>HTTP GET Request</h2>

    <form action="httpmethods" method="get">
        Name:
        <input type="text" name="name" required>

        <button type="submit">Send GET Request</button>
    </form>

    <hr>

    <h2>HTTP POST Request</h2>

    <form action="httpmethods" method="post">
        Name:
        <input type="text" name="name" required>

        <button type="submit">Send POST Request</button>
    </form>

    <hr>

    <h2>HTTP HEAD Request</h2>

    <p>Use the browser developer tools or a terminal to test HEAD.</p>

</body>
</html>
